[project]
name = "mediaexport"
version = "0.1.0"
description = "One export/import file format for streaming download tools: manifest, DRM init data, content keys, title metadata."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/unshackle-dl/mediaexport"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediaexport"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 120
